version: '3.8'

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: root
      POSTGRES_DB: reserving_db
    ports:
      - "5433:5432"
    volumes:
      - pg_data_fix:/var/lib/postgresql/data

volumes:
  pg_data_fix: